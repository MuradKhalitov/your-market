databaseChangeLog:
  - changeSet:
      id: 009-operation-ownership-and-progress
      author: codex
      changes:
        - addColumn:
            tableName: payments
            columns:
              - column: {name: invoice_operation_id, type: uuid}
        - addColumn:
            tableName: advertisements
            columns:
              - column: {name: publication_phase, type: varchar(40)}
              - column: {name: publication_updated_at, type: timestamptz}
              - column: {name: moderation_operation_id, type: uuid}
              - column: {name: moderation_phase, type: varchar(40)}
        - addColumn:
            tableName: advertisement_channel_messages
            columns:
              - column: {name: delete_operation_id, type: uuid}
              - column: {name: message_type, type: varchar(30), defaultValue: PHOTO, constraints: {nullable: false}}
        - createTable:
            tableName: moderation_telegram_messages
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: advertisement_id, type: uuid, constraints: {nullable: false}}
              - column: {name: moderation_operation_id, type: uuid, constraints: {nullable: false}}
              - column: {name: message_id, type: integer, constraints: {nullable: false}}
              - column: {name: position, type: integer, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamptz, constraints: {nullable: false}}
        - addUniqueConstraint: {tableName: moderation_telegram_messages, columnNames: "advertisement_id, position", constraintName: uk_moderation_message_position}
        - createIndex: {tableName: advertisements, indexName: idx_publication_recovery, columns: [{column: {name: status}}, {column: {name: publication_updated_at}}]}
      rollback:
        - dropTable: {tableName: moderation_telegram_messages}
        - dropColumn: {tableName: advertisement_channel_messages, columnName: message_type}
        - dropColumn: {tableName: advertisement_channel_messages, columnName: delete_operation_id}
        - dropColumn: {tableName: advertisements, columnName: moderation_phase}
        - dropColumn: {tableName: advertisements, columnName: moderation_operation_id}
        - dropColumn: {tableName: advertisements, columnName: publication_updated_at}
        - dropColumn: {tableName: advertisements, columnName: publication_phase}
        - dropColumn: {tableName: payments, columnName: invoice_operation_id}
