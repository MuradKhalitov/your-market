spring:
  application:
    name: YourMarket
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5455/your_market}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:}
    token: ${TELEGRAM_BOT_TOKEN:}
  channel:
    id: ${TELEGRAM_CHANNEL_ID:}
    username: ${TELEGRAM_CHANNEL_USERNAME:}
    url: ${TELEGRAM_CHANNEL_URL:https://t.me/your_market}
  payment:
    provider-token: ${YOOKASSA_PROVIDER_TOKEN:}
  moderation:
    chat-id: ${TELEGRAM_MODERATION_CHAT_ID:}
  admin:
    user-ids: ${TELEGRAM_ADMIN_USER_IDS:}
  rate-limit:
    enabled: ${TELEGRAM_RATE_LIMIT_ENABLED:true}
    max-actions: ${TELEGRAM_RATE_LIMIT_MAX_ACTIONS:20}
    window-seconds: ${TELEGRAM_RATE_LIMIT_WINDOW_SECONDS:60}
    retention-hours: ${TELEGRAM_RATE_LIMIT_RETENTION_HOURS:24}
    cleanup-batch-size: ${TELEGRAM_RATE_LIMIT_CLEANUP_BATCH_SIZE:500}
    cleanup-max-batches: ${TELEGRAM_RATE_LIMIT_CLEANUP_MAX_BATCHES:10}
    cleanup-cron: ${TELEGRAM_RATE_LIMIT_CLEANUP_CRON:0 0 3 * * *}
publication:
  price: ${PUBLICATION_PRICE:199.00}
  currency: ${PUBLICATION_CURRENCY:RUB}
  moderation-enabled: ${PUBLICATION_MODERATION_ENABLED:false}
  lifetime-days: ${PUBLICATION_LIFETIME_DAYS:30}
  expiration-cron: "${PUBLICATION_EXPIRATION_CRON:0 0 * * * *}"
  deletion-claim-timeout-seconds: ${PUBLICATION_DELETE_CLAIM_TIMEOUT_SECONDS:180}
  expiration-claim-timeout-seconds: ${PUBLICATION_EXPIRATION_CLAIM_TIMEOUT_SECONDS:600}
admin:
  api-key: ${ADMIN_API_KEY:}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-none}] [%X{telegramUserId:-}] [%X{advertisementId:-}] %logger{36} - %msg%n"
